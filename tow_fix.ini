; tow_fix settings. 1 = enabled, 0 = disabled.
;
; NOTHING HAS TO BE CHANGED HERE: the defaults are the tested configuration.
; Do not edit this file unless you know what you are doing - a wrong value can bring back
; red ships or break the interface. If something breaks, take tow_fix.ini from the archive again.
; Safe to change: [game_speed] percent and [scaling] factor.
;
; Ничего менять не нужно: значения по умолчанию проверены. Не трогайте файл, если не уверены,
; что делаете. Если что-то сломалось - возьмите tow_fix.ini из архива заново.
; Можно менять: [game_speed] percent и [scaling] factor.
[game_folder]
; Find game resources in the folder of TOW.exe (no SUBST drive needed).
enabled=1

[save_redirect]
; Keep saves in the saves folder next to TOW.exe instead of Program Files.
enabled=1

[registry_guard]
; Do not write to the registry; keep game settings in saves\settings.ini.
enabled=1

[startup_warning]
; Skip the 'designed for Windows 95' warning at startup.
enabled=1

[game_speed]
; Game pace in percent of the original 62 ms step (20..200, 100 = original).
percent=80

[draw_sync]
; Draw each game step right away; removes ship stutter from lost steps.
enabled=1

[idle_wait]
; Sleep while the message queue is empty instead of busy-polling (frees a CPU core).
enabled=1
; Longest single sleep in ms (1..100); the game still wakes at once on any message or timer.
max_wait_ms=10

[timer_guard]
; Keep one draw timer and restart a lost game step (fixes freezes after fast ship clicks).
enabled=1

[rgb_device]
; Use the Direct3D RGB renderer instead of Ramp (Ramp draws ships red).
enabled=1

[white_diffuse]
; Use white diffuse for textured vertices (needs rgb_device).
enabled=1
; Untextured zero-diffuse vertices use the game material; RGB fallback if unavailable.
untextured_color=0x503820

[scaling]
; Integer scaling: 0 = off, 2..4 or auto.
factor=auto

; Fullscreen while scaling: borderless = centred with black backdrop, off = always windowed.
fullscreen=borderless

; Log up to 40 top-level window show events while scaling (diagnostic).
log_windows=0

; Enlarge fonts of standard controls (owner-drawn controls keep the original).
fonts=1

; Enlarge game-loaded cursors to 32N pixels, including their hotspots.
cursor=1

; Avoid cursor jumps when narrow sail/crew drag strips are activated.
soft_cursor_clip=1

; Enlarge small dialogs; centring is always enabled.
dialogs=1

; Scale client paint DCs and owner-drawn message DCs.
dc_transform=1

; Also transform paint DCs of the Anibtn32 control (diagnostic; 0 = like the original stand)
dc_transform_controls=0

[display]
; Make non-test mode changes temporary so Windows restores the display on exit.
restore_on_exit=1

[d3d11]
; Refresh underlying GDI every N ms; 0 = each frame, -1 = off.
gdi_refresh_ms=250
; Direct3D 11 output; 0 restores GDI.
enabled=1
; Allow software WARP only if hardware device creation fails.
warp=0
; Extra transition diagnostics.
log=0
; Mission scene interpolation; 0 keeps the plain-frame fallback. Missing key = 0.
smooth=1

[wake]
; Wake behind every ship in the smooth D3D11 scene; 0 turns it off.
; Own ripple stays with the game's Ship Wake option; bubbles cover every captured ship.
; Land masks foam using the original A0; ripples always use that sea mask.
enabled=1
land=1
; Game wave: damping 1..8, strength 1..32767, cell size 1/2/4 pixels.
; Step follows game_speed (78 ms at the default 80 percent).
damping=4
strength=127
resolution=2
; Bubble cap per ship, or a single shared cap; budget 1..100000.
budget=1000
budget_mode=per-ship

[diag]
; Diagnostics, observation only: cursor clipping, Yes/No dialog layout, ship masks,
; UI freshness/clipping, screen transitions, game timers. Missing keys = 0.
; all=1 enables every diagnostic; individual keys enable only that area.
; Buffered English lines in tow_fix.log, at most 3000 per key per 60 seconds,
; plus summaries. No rendering/input fix is enabled by these keys.
all=0
cursor=0
yesno=0
masks=0
ui=0
transitions=0
; Timer API results, message delivery, gaps and step stalls.
timers=0
