name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: cmd
        run: call build.cmd

      - name: Lint
        shell: cmd
        run: call lint.cmd

      # Releases only for v* tags; plain pushes and pull requests just build and lint.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $dir = "dist\tow_fix"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build\tow_fix.dll, build\tow_patch.exe, build\tow_fix.ini, README.md, README.ru.md, LICENSE, CHANGELOG.md $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\tow_fix-$env:GITHUB_REF_NAME.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist\tow_fix-$env:GITHUB_REF_NAME.zip" --title "Tides of War fix $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
